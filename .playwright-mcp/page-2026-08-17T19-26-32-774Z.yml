            - listitem [ref=f8e130]: Three minutes a day if you want it, with any of the three strangers.
            - listitem [ref=f8e131]: A measured read-back after every session, and one thing to work on.
            - listitem [ref=f8e132]: Cancel whenever. No notice period, no exit questionnaire.
