              - generic [ref=f12e128]: a month
            - list [ref=f12e129]:
              - listitem [ref=f12e130]: Three minutes a day if you want it, with any of the three strangers.
              - listitem [ref=f12e131]: A measured read-back after every session, and one thing to work on.
              - listitem [ref=f12e132]: Cancel whenever. No notice period, no exit questionnaire.
          - button "Practise for £6 a month" [ref=f12e134] [cursor=pointer]
          - paragraph [ref=f12e135]: Practice sessions and the report that follows are a rehearsal exercise. Paying changes how many conversations you can have, and nothing else.
